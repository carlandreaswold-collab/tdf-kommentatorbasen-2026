<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VM-kommentatorbasen 2026 — Montréal</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a3242;
    --txt:#e8edf4; --dim:#9aa6b6; --radius:12px;
    --accent:#f5c000; --accent-rgb:245,192,0;
  }
  body.kvinner{
    --accent:#b06aff; --accent-rgb:176,106,255;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
    transition:--accent .3s;
  }
  a{color:var(--accent);text-decoration:none}

  /* ---- TOPBAR ---- */
  header.topbar{
    display:flex;align-items:center;gap:12px;padding:9px 16px;
    background:linear-gradient(90deg,#10141b,#161b22);
    border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  .topbar h1{font-size:16px;margin:0;letter-spacing:.3px;white-space:nowrap}
  .topbar h1 b{color:var(--accent)}
  .topbar .meta{color:var(--dim);font-size:12px;white-space:nowrap}
  .topbar .grow{flex:1}

  .kjønn-toggle{
    display:flex;background:#0d1017;border:1px solid var(--line);
    border-radius:999px;overflow:hidden;flex-shrink:0;
  }
  .kjønn-toggle button{
    padding:7px 18px;border:none;cursor:pointer;font-size:13px;font-weight:700;
    background:transparent;color:var(--dim);transition:background .2s,color .2s;
    white-space:nowrap;
  }
  .kjønn-toggle button.aktiv{
    background:var(--accent);color:#000;border-radius:999px;
  }

  /* ---- LAYOUT ---- */
  .layout{display:flex;flex:1;min-height:0}
  aside.dash{
    width:330px;flex:0 0 330px;border-right:1px solid var(--line);
    background:var(--panel);overflow-y:auto;padding:12px;
  }
  main.innhold{flex:1;display:flex;flex-direction:column;min-width:0}

  /* ---- DASHBOARD ---- */
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:11px;margin-bottom:10px}
  .card h2{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
  .kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:13px;border-bottom:1px dashed #232b39}
  .kv:last-child{border-bottom:0}
  .kv span:first-child{color:var(--dim)}
  .kv span:last-child{text-align:right;font-weight:600;max-width:60%}

  .fav{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px dashed #232b39;cursor:pointer}
  .fav:last-child{border-bottom:0}
  .fav:hover{color:var(--accent)}
  .fav .rank{width:18px;color:var(--accent);font-weight:800;text-align:center;flex-shrink:0;padding-top:1px}
  .fav .info{flex:1;min-width:0}
  .fav .nm{font-weight:600;font-size:13px}
  .fav .flaglag{color:var(--dim);font-size:12px}
  .fav .notattekst{color:var(--dim);font-size:11.5px;line-height:1.35;margin-top:2px}

  /* ---- FANER ---- */
  .tab-bar{display:flex;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
  .tab-bar button{
    padding:11px 18px;border:none;background:transparent;color:var(--dim);
    font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;
    transition:color .15s;white-space:nowrap;
  }
  .tab-bar button.aktiv{color:var(--accent);border-bottom-color:var(--accent)}

  /* ---- SØK ---- */
  .søk-wrapper{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
  .søk-boks{position:relative}
  .søk-boks input{
    width:100%;padding:11px 14px 11px 38px;font-size:15px;color:var(--txt);
    background:var(--bg);border:1px solid var(--line);border-radius:10px;outline:none
  }
  .søk-boks input:focus{border-color:var(--accent)}
  .søk-boks .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:16px}
  .filtre{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .filtre button{
    background:#1b2230;border:1px solid var(--line);color:var(--dim);
    padding:5px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;
  }
  .filtre button.aktiv{background:rgba(var(--accent-rgb),.15);border-color:var(--accent);color:var(--accent)}

  /* ---- RYTTER-LISTE ---- */
  .rytter-liste{flex:1;overflow-y:auto;padding:10px}

  .rkort{
    background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;margin-bottom:8px;cursor:pointer;
    transition:border-color .15s;
  }
  .rkort:hover{border-color:var(--accent)}
  .rkort.norsk{border-left:3px solid var(--accent)}
  .rkort-hode{display:flex;align-items:center;gap:10px}
  .rkort-flagg{font-size:20px;flex-shrink:0}
  .rkort-navn{font-size:15px;font-weight:700}
  .rkort-meta{color:var(--dim);font-size:12px}
  .rkort-badges{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
  .badge{
    display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;
    border:1px solid var(--line);background:#1b2230;color:var(--dim);
  }
  .badge.norsk{background:rgba(var(--accent-rgb),.15);border-color:var(--accent);color:var(--accent)}
  .badge.klatrer{background:#0d2a1e;border-color:#1e7a4a;color:#4cd89a}
  .badge.sprinter{background:#2a1a0d;border-color:#7a4a1e;color:#d8944c}
  .badge.allrounder{background:#1a1a2a;border-color:#3a3a7a;color:#7a7ad8}
  .badge.puncheur{background:#2a1a2a;border-color:#7a1a7a;color:#d87ad8}
  .badge.tempo{background:#1a2a2a;border-color:#1a6a7a;color:#4cd8d8}

  .rkort-detaljer{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
  .rkort-detaljer h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim)}
  .rkort-detaljer ul{margin:0 0 8px;padding-left:16px;color:var(--dim)}
  .rkort-detaljer ul li{margin-bottom:2px}
  .rkort-detaljer .notat-tekst{
    background:#111820;border-left:3px solid var(--accent);
    padding:8px 10px;border-radius:0 8px 8px 0;font-size:12.5px;
    line-height:1.5;color:var(--txt);margin-top:6px;
  }
  .rkort-detaljer .form-tekst{color:var(--txt);margin-bottom:6px}

  /* ---- VM PROGRAM ---- */
  .program-wrapper{flex:1;overflow-y:auto;padding:14px}
  .program-tabell{width:100%;border-collapse:collapse;font-size:13.5px}
  .program-tabell th{
    text-align:left;padding:8px 10px;color:var(--dim);font-size:11px;
    text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--line);
  }
  .program-tabell td{padding:9px 10px;border-bottom:1px dashed #1e2530;vertical-align:middle}
  .program-tabell tr:hover td{background:#1a2030}
  .program-tabell tr.ferdig td{color:var(--dim)}
  .program-tabell tr.idag td{background:rgba(var(--accent-rgb),.07)}
  .program-tabell tr.idag td:first-child{font-weight:700;color:var(--accent)}
  .program-tabell tr.kommende td{font-weight:600}
  .program-tabell tr.hviledag td{color:#444;font-style:italic}
  .status-pil{
    display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;
  }
  .status-pil.ferdig{background:#1a2e1a;color:#4cd87a}
  .status-pil.idag{background:rgba(var(--accent-rgb),.2);color:var(--accent)}
  .status-pil.imorgen{background:#1e2530;color:#7090b0}
  .status-pil.kommende{background:#1e2530;color:#7090b0}
  .vinner-tekst{color:var(--txt);font-size:13px}
  .vinner-tekst em{color:var(--dim);font-style:normal}

  /* ---- HISTORIKK ---- */
  .historikk-wrapper{flex:1;overflow-y:auto;padding:14px}
  .historikk-tabs{display:flex;gap:8px;margin-bottom:14px}
  .historikk-tabs button{
    padding:7px 16px;border:1px solid var(--line);border-radius:999px;
    background:transparent;color:var(--dim);font-size:13px;cursor:pointer;font-weight:600;
  }
  .historikk-tabs button.aktiv{
    background:rgba(var(--accent-rgb),.15);border-color:var(--accent);color:var(--accent);
  }
  .hist-tabell{width:100%;border-collapse:collapse;font-size:13px}
  .hist-tabell th{
    text-align:left;padding:7px 8px;color:var(--dim);font-size:11px;
    text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line);
  }
  .hist-tabell td{padding:8px 8px;border-bottom:1px dashed #1e2530;vertical-align:top}
  .hist-tabell tr:hover td{background:#1a2030}
  .hist-tabell tr.norsk-rad td{background:rgba(var(--accent-rgb),.06);font-weight:600}
  .hist-tabell tr.kjørt-rad td{color:var(--dim);font-style:italic}
  .hist-tabell .norsk-notat{
    display:block;margin-top:3px;font-size:12px;color:var(--accent);font-weight:700;
  }
  .year-col{font-weight:700;white-space:nowrap;color:var(--txt)}
  .sted-col{color:var(--dim);font-size:12px}

  /* ---- INGEN RESULTATER ---- */
  .ingen{color:var(--dim);text-align:center;padding:40px;font-style:italic}
</style>
</head>
<body>

<header class="topbar">
  <div>
    <h1>🌈 <b id="topTittel">VM Montréal 2026</b></h1>
    <div class="meta" id="topMeta">UCI Road World Championships · 20.–27. september</div>
  </div>
  <div class="grow"></div>
  <div class="kjønn-toggle">
    <button id="btnHerrer" class="aktiv" onclick="byttKjønn('herrer')">🚴 Herrer</button>
    <button id="btnKvinner" onclick="byttKjønn('kvinner')">🚴 Kvinner</button>
  </div>
</header>

<div class="layout">

  <!-- VENSTRE: DASHBOARD -->
  <aside class="dash" id="dash"></aside>

  <!-- HØYRE: FANER + INNHOLD -->
  <main class="innhold">
    <nav class="tab-bar">
      <button id="tab-rytterinfo" class="aktiv" onclick="byttTab('rytterinfo')">🔍 Rytterinfo</button>
      <button id="tab-program" onclick="byttTab('program')">📋 VM-program</button>
      <button id="tab-historikk" onclick="byttTab('historikk')">🏆 Historikk</button>
    </nav>
    <div id="innholdPane" style="display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden"></div>
  </main>

</div>

<script src="data_vm.js"></script>
<script>
// ====================================================
// TILSTAND
// ====================================================
const state = {
  kjønn: 'herrer',
  tab: 'rytterinfo',
  historikkTab: 'fellesstart',
  søk: '',
  filter: '',
  åpneKort: new Set()
};

// ====================================================
// KJØNN-TOGGLE
// ====================================================
function byttKjønn(kjønn) {
  state.kjønn = kjønn;
  state.søk = '';
  state.filter = '';
  state.åpneKort.clear();
  document.body.classList.toggle('kvinner', kjønn === 'kvinner');
  document.getElementById('btnHerrer').classList.toggle('aktiv', kjønn === 'herrer');
  document.getElementById('btnKvinner').classList.toggle('aktiv', kjønn === 'kvinner');
  const tittel = kjønn === 'herrer'
    ? 'VM Montréal 2026 · Herrer'
    : 'VM Montréal 2026 · Kvinner';
  document.getElementById('topTittel').textContent = tittel;
  render();
}

// ====================================================
// FANE-TOGGLE
// ====================================================
function byttTab(tab) {
  state.tab = tab;
  ['rytterinfo','program','historikk'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('aktiv', t === tab);
  });
  renderInnhold();
}

function byttHistorikkTab(tab) {
  state.historikkTab = tab;
  renderInnhold();
}

// ====================================================
// HOVED-RENDER
// ====================================================
function render() {
  renderDash();
  renderInnhold();
}

// ====================================================
// VENSTRE PANEL
// ====================================================
function renderDash() {
  const d = VM_DATA[state.kjønn];
  const lf = d.løpsfakta;
  const emoji = state.kjønn === 'herrer' ? '🚴' : '🚴';

  let html = '';

  // Løpsfakta
  html += `<div class="card">
    <h2>${emoji} Løpsfakta — ${state.kjønn === 'herrer' ? 'Herrer' : 'Kvinner'} fellesstart</h2>
    <div class="kv"><span>Distanse</span><span>${lf.distanse}</span></div>
    <div class="kv"><span>Høydemeter</span><span>${lf.høydemeter}</span></div>
    <div class="kv"><span>Runder</span><span>${lf.runder}</span></div>
    <div class="kv"><span>Start</span><span>${lf.start}</span></div>
    <div class="kv"><span>Mål</span><span>${lf.mål}</span></div>
    <div class="kv"><span>Dato</span><span>${lf.avgang}</span></div>
  </div>`;

  // Baneinfo
  html += `<div class="card">
    <h2>⛰️ Baneinfo</h2>
    <div class="kv"><span>Nøkkelstigning</span><span style="font-size:12px">${lf.nøkkelstigning}</span></div>
    <div class="kv"><span>Andre bakker</span><span style="font-size:12px">${lf.andreBakker}</span></div>
    <div class="kv"><span>ITT-bane</span><span style="font-size:12px">${VM_DATA.meta.ITTbane}</span></div>
  </div>`;

  // Forsvarende mester
  html += `<div class="card">
    <h2>🌈 Forsvarende mester</h2>
    <div style="font-size:13px;line-height:1.5;color:var(--txt)">${lf.forsvarendeMester}</div>
  </div>`;

  // Favoritter
  html += `<div class="card">
    <h2>⭐ Toppfavoritter</h2>`;
  d.favoritter.forEach((f, i) => {
    html += `<div class="fav" onclick="søkEtter('${f.navn}')">
      <span class="rank">${i+1}</span>
      <div class="info">
        <div class="nm">${f.flagg} ${f.navn}</div>
        <div class="flaglag">${f.land} · ${f.lag}</div>
        <div class="notattekst">${f.notat}</div>
      </div>
    </div>`;
  });
  html += `</div>`;

  document.getElementById('dash').innerHTML = html;
}

// ====================================================
// INNHOLD (FANER)
// ====================================================
function renderInnhold() {
  const pane = document.getElementById('innholdPane');
  if (state.tab === 'rytterinfo') renderRytterinfo(pane);
  else if (state.tab === 'program') renderProgram(pane);
  else if (state.tab === 'historikk') renderHistorikk(pane);
}

// ---- RYTTERINFO ----
function renderRytterinfo(pane) {
  const ryttere = VM_DATA[state.kjønn].ryttere;

  // Bygg søk + filter-UI
  const spesialiteter = [...new Set(ryttere.map(r => r.spesialitet))];
  const land = [...new Set(ryttere.map(r => r.land))].sort();

  pane.innerHTML = `
    <div class="søk-wrapper">
      <div class="søk-boks">
        <span class="ico">🔍</span>
        <input id="søkInput" type="text" placeholder="Søk rytter, lag, land, spesialitet…"
          value="${state.søk}" oninput="oppdaterSøk(this.value)" autocomplete="off">
      </div>
      <div class="filtre">
        <button class="${state.filter===''?'aktiv':''}" onclick="setFilter('')">Alle</button>
        ${spesialiteter.map(s => `<button class="${state.filter===s?'aktiv':''}" onclick="setFilter('${s}')">${kapitaliser(s)}</button>`).join('')}
        <button class="${state.filter==='norsk'?'aktiv':''}" onclick="setFilter('norsk')">🇳🇴 Norske</button>
      </div>
    </div>
    <div class="rytter-liste" id="rytterListe"></div>`;

  setTimeout(() => { document.getElementById('søkInput').focus(); }, 50);
  renderRytterliste();
}

function renderRytterliste() {
  const ryttere = VM_DATA[state.kjønn].ryttere;
  const q = state.søk.toLowerCase();
  const fil = state.filter;

  const filtrert = ryttere.filter(r => {
    const erNorsk = r.land === 'Norge';
    if (fil === 'norsk' && !erNorsk) return false;
    if (fil && fil !== 'norsk' && r.spesialitet !== fil) return false;
    if (!q) return true;
    return (
      r.navn.toLowerCase().includes(q) ||
      r.land.toLowerCase().includes(q) ||
      r.lag.toLowerCase().includes(q) ||
      r.spesialitet.toLowerCase().includes(q) ||
      (r.palmarès && r.palmarès.some(p => p.toLowerCase().includes(q))) ||
      (r.notat && r.notat.toLowerCase().includes(q))
    );
  });

  const liste = document.getElementById('rytterListe');
  if (!liste) return;

  if (filtrert.length === 0) {
    liste.innerHTML = '<div class="ingen">Ingen ryttere funnet</div>';
    return;
  }

  liste.innerHTML = filtrert.map(r => {
    const erNorsk = r.land === 'Norge';
    const åpen = state.åpneKort.has(r.navn);
    const badgeKlasse = {'klatrer':'klatrer','sprinter':'sprinter','allrounder':'allrounder','puncheur':'puncheur','tempo':'tempo'}[r.spesialitet] || '';

    let detaljer = '';
    if (åpen) {
      detaljer = `<div class="rkort-detaljer">
        <h4>Form 2026</h4>
        <p class="form-tekst">${r.form}</p>
        <h4>Palmarès</h4>
        <ul>${r.palmarès.map(p => `<li>${p}</li>`).join('')}</ul>
        <h4>Kommentarnote</h4>
        <div class="notat-tekst">${r.notat}</div>
      </div>`;
    }

    return `<div class="rkort${erNorsk?' norsk':''}" onclick="toggleKort('${r.navn.replace(/'/g,"\\'")}')">
      <div class="rkort-hode">
        <span class="rkort-flagg">${r.flagg}</span>
        <div style="flex:1">
          <div class="rkort-navn">${r.navn} <span style="font-size:13px;font-weight:400;color:var(--dim)">${r.alder} år</span></div>
          <div class="rkort-meta">${r.land} · ${r.lag}</div>
        </div>
        <span style="color:var(--dim);font-size:12px">${åpen ? '▲' : '▼'}</span>
      </div>
      <div class="rkort-badges">
        <span class="badge ${badgeKlasse}">${kapitaliser(r.spesialitet)}</span>
        ${erNorsk ? '<span class="badge norsk">🇳🇴 Norsk</span>' : ''}
      </div>
      ${detaljer}
    </div>`;
  }).join('');
}

function toggleKort(navn) {
  if (state.åpneKort.has(navn)) state.åpneKort.delete(navn);
  else state.åpneKort.add(navn);
  renderRytterliste();
}

function oppdaterSøk(v) {
  state.søk = v;
  state.åpneKort.clear();
  renderRytterliste();
}

function setFilter(f) {
  state.filter = f;
  state.søk = '';
  state.åpneKort.clear();
  renderRytterinfo(document.getElementById('innholdPane'));
}

function søkEtter(navn) {
  state.tab = 'rytterinfo';
  state.søk = navn;
  state.åpneKort.add(navn);
  ['rytterinfo','program','historikk'].forEach(t =>
    document.getElementById('tab-'+t).classList.toggle('aktiv', t === 'rytterinfo')
  );
  renderInnhold();
}

// ---- VM-PROGRAM ----
function renderProgram(pane) {
  const statusLabel = { ferdig:'Ferdig', idag:'I dag', imorgen:'I morgen', kommende:'Kommende', hviledag:'Hviledag' };

  const rader = VM_DATA.program.map(p => {
    const klasse = p.status;
    const badge = p.status !== 'hviledag'
      ? `<span class="status-pil ${p.status}">${statusLabel[p.status] || p.status}</span>`
      : '';
    const vinner = p.vinner !== '—'
      ? `<span class="vinner-tekst">${p.vinner}</span>`
      : `<em>—</em>`;

    return `<tr class="${klasse}">
      <td>${p.dato}</td>
      <td>${p.kategori}</td>
      <td>${p.distanse}</td>
      <td>${badge}</td>
      <td>${vinner}</td>
    </tr>`;
  }).join('');

  pane.innerHTML = `<div class="program-wrapper">
    <table class="program-tabell">
      <thead><tr>
        <th>Dato</th><th>Kategori</th><th>Distanse</th><th>Status</th><th>Vinner</th>
      </tr></thead>
      <tbody>${rader}</tbody>
    </table>
  </div>`;
}

// ---- HISTORIKK ----
function renderHistorikk(pane) {
  const ht = state.historikkTab;
  const kjønn = state.kjønn;
  const nøkkel = `${kjønn}_${ht}`;
  const data = VM_DATA.historikk[nøkkel] || [];

  const tittel = kjønn === 'herrer' ? 'Herrer' : 'Kvinner';
  const subtittel = ht === 'fellesstart' ? 'Fellesstart' : 'Tempo';

  const rader = [...data].reverse().map(r => {
    const harNorsk = r.norskFlagg;
    const kjørtKlasse = r.kjørt ? 'kjørt-rad' : '';
    const norskKlasse = harNorsk ? 'norsk-rad' : '';
    const norskHtml = r.norsk !== '—'
      ? `<span class="norsk-notat">${r.norsk}</span>`
      : '';

    return `<tr class="${norskKlasse} ${kjørtKlasse}">
      <td class="year-col">${r.år}</td>
      <td class="sted-col">${r.sted}</td>
      <td>${r.gull}</td>
      <td style="color:var(--dim)">${r.sølv}</td>
      <td style="color:var(--dim)">${r.bronse}</td>
      <td>${norskHtml}</td>
    </tr>`;
  }).join('');

  pane.innerHTML = `<div class="historikk-wrapper">
    <div class="historikk-tabs">
      <button class="${ht==='fellesstart'?'aktiv':''}" onclick="byttHistorikkTab('fellesstart')">🚴 Fellesstart</button>
      <button class="${ht==='tempo'?'aktiv':''}" onclick="byttHistorikkTab('tempo')">⏱️ Tempo</button>
    </div>
    <div style="margin-bottom:10px;font-size:12px;color:var(--dim)">
      ${tittel} · ${subtittel} · 2026–2010
      ${kjønn==='herrer'&&ht==='fellesstart' ? ' · <b style="color:var(--accent)">🇳🇴 Hushovd 2010 · EBH 2012 · Kristoff 2017</b>' : ''}
      ${kjønn==='herrer'&&ht==='tempo' ? ' · <b style="color:var(--accent)">🇳🇴 Foss 2022 · Evenepoel 2022–2026 (5 strake)</b>' : ''}
    </div>
    <table class="hist-tabell">
      <thead><tr>
        <th>År</th><th>Sted</th><th>🥇 Gull</th><th>🥈 Sølv</th><th>🥉 Bronse</th><th>🇳🇴 Norsk</th>
      </tr></thead>
      <tbody>${rader}</tbody>
    </table>
  </div>`;
}

// ====================================================
// HJELP
// ====================================================
function kapitaliser(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

// ====================================================
// START
// ====================================================
render();
</script>
</body>
</html>
