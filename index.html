<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TdF-kommentatorbasen</title>
<meta http-equiv="refresh" content="0; url=2026/">
<style>
  :root{--bg:#0e1116;--txt:#e8edf4;--dim:#9aa6b6;--line:#2a3242;--accent:#f5d000;--panel:#161b22;--radius:12px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px}
  h1{font-size:22px;letter-spacing:.3px}
  h1 b{color:var(--accent)}
  .subtitle{color:var(--dim);font-size:14px}
  .years{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .year-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px 40px;text-align:center;text-decoration:none;color:var(--txt);
    transition:border-color .15s,transform .15s;
  }
  .year-card:hover{border-color:var(--accent);transform:translateY(-2px);text-decoration:none}
  .year-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .year-card .yr{font-size:32px;font-weight:800;color:var(--accent)}
  .year-card .lbl{font-size:12px;color:var(--dim);margin-top:4px}
  .year-card.future{opacity:.4;cursor:default;pointer-events:none}
  .year-card.future .yr{color:var(--dim)}
  .note{color:var(--dim);font-size:12px}
</style>
</head>
<body>
  <div style="text-align:center">
    <h1>🚴 <b>TdF</b>-kommentatorbasen</h1>
    <p class="subtitle">Velg sesong</p>
  </div>
  <div class="years">
    <a class="year-card active" href="2026/">
      <div class="yr">2026</div>
      <div class="lbl">113. utgave · Barcelona → Paris</div>
    </a>
    <div class="year-card future">
      <div class="yr">2027</div>
      <div class="lbl">Kommer neste år</div>
    </div>
  </div>
  <p class="note">Videresender automatisk til 2026 …</p>
</body>
</html>
